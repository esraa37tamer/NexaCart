name: nexacart
description: NexaCart
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  realm: ^20.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cached_network_image: ^4.0.4
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/design_reference/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#F5F9FF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F9FF"
  image: assets/images/native_splash_mark.png
  android_12:
    color: "#F5F9FF"
    image: assets/images/native_splash_mark.png
  android: true
  ios: true
  web: false
